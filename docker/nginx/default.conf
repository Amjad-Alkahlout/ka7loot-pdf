server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Maximum file upload size matching Ka7loot PDF limits
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Security headers for proxied responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Allow Livewire dynamic endpoints and assets (e.g. /livewire/livewire.min.js) to reach Laravel
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Laravel standard routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI processing for PHP
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Forward proxy headers from host Nginx to PHP-FPM
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;

        # Timeouts for longer PDF/image processing jobs
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
        fastcgi_connect_timeout 10;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # Lightweight healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
