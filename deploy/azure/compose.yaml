services:
  # ============================================================================
  # Internal Web Server (Reverse Proxy & Static Asset Server)
  # ============================================================================
  web:
    image: ghcr.io/amjad-alkahlout/ka7loot-pdf/web:${IMAGE_TAG:-sha-c6206a0}
    container_name: documorph_web
    restart: unless-stopped
    ports:
      # Strictly bound to local loopback - Never exposed publicly
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - documorph_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ============================================================================
  # Application Runtime (PHP 8.5-FPM + Node.js + PDFium + Tools)
  # ============================================================================
  app:
    image: ghcr.io/amjad-alkahlout/ka7loot-pdf/app:${IMAGE_TAG:-sha-c6206a0}
    container_name: documorph_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    volumes:
      - documorph_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - documorph_net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  # ============================================================================
  # Queue Worker (Processes asynchronous PDF/Image operations)
  # ============================================================================
  worker:
    image: ghcr.io/amjad-alkahlout/ka7loot-pdf/app:${IMAGE_TAG:-sha-c6206a0}
    container_name: documorph_worker
    restart: unless-stopped
    command: php artisan queue:work database --queue=heavy,default --sleep=3 --tries=3 --timeout=120 --max-time=3600
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      QUEUE_CONNECTION: database
    volumes:
      - documorph_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - documorph_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ============================================================================
  # Scheduler (Native Laravel schedule worker for 15-min file pruning)
  # ============================================================================
  scheduler:
    image: ghcr.io/amjad-alkahlout/ka7loot-pdf/app:${IMAGE_TAG:-sha-c6206a0}
    container_name: documorph_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - documorph_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - documorph_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  # ============================================================================
  # Database Server (MySQL 8.4)
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: documorph_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-documorph}
      MYSQL_USER: ${DB_USERNAME:-documorph_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - documorph_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - documorph_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  documorph_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==============================================================================
# Persistent Storage Volumes
# ==============================================================================
volumes:
  documorph_db_data:
    name: documorph_db_data
  documorph_storage:
    name: documorph_storage
